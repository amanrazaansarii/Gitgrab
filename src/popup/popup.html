<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitGrab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="gitgrab-popup">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"/>
        </svg>
        <span class="logo-text">GitGrab</span>
      </div>
      <div class="header-actions">
        <a id="token-status" class="token-badge" href="#" title="Manage GitHub Token">
          <span class="status-dot"></span>
          <span id="token-status-text">60 req/hr</span>
        </a>
        <button id="settings-btn" class="icon-btn" title="Settings" type="button">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
            <path d="M8 0a8.2 8.2 0 0 0-.704.032.75.75 0 0 0-.643.593l-.337 1.684a6.762 6.762 0 0 0-1.637.945L3.06 2.348a.75.75 0 0 0-.825.263l-.707 1.225a.75.75 0 0 0 .18 1.002l1.328 1.022a6.745 6.745 0 0 0-.001 1.88l-1.328 1.022a.75.75 0 0 0-.18 1.002l.707 1.225c.214.37.669.49 1.025.263l1.62-.906c.5.378 1.05.698 1.638.945l.337 1.684a.75.75 0 0 0 .643.593A8.2 8.2 0 0 0 8 16a8.2 8.2 0 0 0 .704-.032.75.75 0 0 0 .643-.593l.337-1.684a6.762 6.762 0 0 0 1.637-.945l1.62.906c.356.227.811.107 1.025-.263l.707-1.225a.75.75 0 0 0-.18-1.002l-1.328-1.022a6.745 6.745 0 0 0 .001-1.88l1.328-1.022a.75.75 0 0 0 .18-1.002l-.707-1.225a.75.75 0 0 0-.825-.263l-1.62.906a6.762 6.762 0 0 0-1.637-.945l-.337-1.684a.75.75 0 0 0-.643-.593A8.2 8.2 0 0 0 8 0Zm0 6a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Context Card (Active Tab) -->
    <div id="tab-context" class="context-card">
      <div class="context-loading">Detecting current GitHub page...</div>
    </div>

    <!-- URL Input Downloader -->
    <div class="section-divider">
      <span>OR DOWNLOAD BY LINK</span>
    </div>

    <div class="custom-url-box">
      <div class="input-wrapper">
        <input 
          id="custom-url-input" 
          type="text" 
          placeholder="Paste GitHub repo, folder, or file URL..." 
          spellcheck="false"
        >
        <button id="paste-btn" class="mini-btn" type="button" title="Paste from clipboard">Paste</button>
      </div>
      <button id="custom-download-btn" class="btn btn-secondary w-full" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
          <path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"></path>
          <path d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.78a.749.749 0 1 1 1.06-1.06l1.97 1.969Z"></path>
        </svg>
        <span>Download from URL</span>
      </button>
    </div>

    <!-- Progress Modal/Overlay -->
    <div id="progress-container" class="progress-section hidden">
      <div class="progress-header">
        <span id="progress-target" class="progress-target">Downloading...</span>
        <span id="progress-percent" class="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%"></div>
      </div>
      <div id="progress-status" class="progress-status">Starting download...</div>
    </div>

    <!-- Message Alert Box -->
    <div id="alert-box" class="alert hidden"></div>

    <!-- Footer -->
    <footer class="footer">
      <span>100% Client-Side & Private • ZIP on the fly</span>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="../lib/jszip.min.js"></script>
  <script src="../utils/url-parser.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="../lib/github-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
